<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <h1 class="header">Counter</h1>
      <div class="container">
        <input
          class="display"
          id="display"
          type="text"
          value="count 0"
          autocomplete="off"
          readonly
        />
        <div class="status" id="status"></div>
        <div class="buttons">
          <button class="incBtn" id="incBtn">inc</button>
          <button class="decBtn" id="decBtn">dec</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
